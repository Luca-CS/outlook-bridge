[project]
name = "outlook-bridge"
version = "0.1.0"
description = "Read-only bridge between classic Outlook (COM) and Claude: CLI, MCP server, snapshots"
authors = [
    { name = "Luca-CS" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "pywin32>=312",
    "typer>=0.27.3",
    "tzdata>=2026.5",
]

[project.scripts]
outlook-bridge = "outlook_bridge.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["outlook: needs Windows + a running classic Outlook (real COM)"]
# --tb=short: never dump fixture/argument values, which may hold real mail data (-m outlook).
addopts = "-m 'not outlook' --tb=short"
